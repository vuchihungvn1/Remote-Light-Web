name: Test phone network recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare disposable Chromium test
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/rl-browser" --no-save playwright@1.65.1 ws@8.18.3
          "$RUNNER_TEMP/rl-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Pair, switch network, and measure cursor packets
        shell: bash
        run: |
          trap 'sudo tc qdisc del dev lo root 2>/dev/null || true' EXIT
          NODE_PATH="$RUNNER_TEMP/rl-browser/node_modules" node scripts/test-controller.cjs
